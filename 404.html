<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page Not Found</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: monospace;
      background: #161616;
      color: #b8b8b8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    main { text-align: center; }
    .code {
      font-size: clamp(80px, 20vw, 140px);
      font-weight: 700;
      color: #383838;
      line-height: 1;
      margin-bottom: 1rem;
      user-select: none;
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #909090;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      color: #f4f4f4;
      margin-bottom: 1rem;
      font-weight: 400;
    }
    p { font-size: 14px; color: #6c6c6c; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <div class="eyebrow">Page not found</div>
    <h1>Nothing here but packets.</h1>
    <p>The page you requested doesn't exist.</p>
  </main>
</body>
</html>
