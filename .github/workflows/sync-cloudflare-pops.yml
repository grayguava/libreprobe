name: sync Cloudflare edge PoPs

on:
  schedule:
    - cron: "0 6 1 * *"  # monthly cron

  push:
    paths:
      - "scripts/sync_cloudflare_pops.py"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't write or commit anything)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run sync script
        run: |
          python scripts/sync_cloudflare_pops.py \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet assets/data/cloudflare-edge-locations.json \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true"  >> "$GITHUB_OUTPUT"

      - name: Commit and push updated JSON
        if: steps.diff.outputs.changed == 'true' && !inputs.dry_run
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/cloudflare-edge-locations.json
          git commit -m "chore: sync Cloudflare edge PoPs [skip ci]"
          git push

      - name: No changes detected
        if: steps.diff.outputs.changed == 'false'
        run: echo "assets/data/cloudflare-edge-locations.json is already up-to-date."

      - name: Commit run log
        if: always() && !inputs.dry_run
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/logs/
          git diff --cached --quiet || git commit -m "chore: add sync run log [skip ci]"
          git push