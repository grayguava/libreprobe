name: Snapshot Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. snapshot-2024-06-07)"
        required: true
        type: string

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout full repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag input
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            echo "::error::Tag input is required."
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build snapshot archive
        run: |
          ARCHIVE="snapshot-${TAG}.tar.gz"

          # Include ALL tracked files (respects .gitignore naturally via git ls-files)
          # but also force-include .gitignore itself and other dotfiles that git tracks
          git ls-files | tar \
            --create \
            --gzip \
            --file "$ARCHIVE" \
            --files-from=-

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Generate SHA-256 checksum
        run: |
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "Checksum:"
          cat "${ARCHIVE}.sha256"

      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "Snapshot: $TAG" \
            --notes "Full repository snapshot at commit \`${{ github.sha }}\` on branch \`${{ github.ref_name }}\`." \
            "$ARCHIVE" \
            "${ARCHIVE}.sha256"
